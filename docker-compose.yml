services:
  # Base de données pour le service Membres
  db-membres:
    image: postgres:15-alpine
    container_name: cogarden-db-membres
    environment:
      POSTGRES_DB: membres_db
      POSTGRES_USER: cogarden_user
      POSTGRES_PASSWORD: cogarden_pass
    ports:
      - "5436:5432"
    volumes:
      - pgdata-membres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogarden_user -d membres_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogarden-network

  # Base de données pour le service Parcelles
  db-parcelles:
    image: postgres:15-alpine
    container_name: cogarden-db-parcelles
    environment:
      POSTGRES_DB: parcelles_db
      POSTGRES_USER: cogarden_user
      POSTGRES_PASSWORD: cogarden_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata-parcelles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogarden_user -d parcelles_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogarden-network

  # Base de données pour le service Tâches
  db-taches:
    image: postgres:15-alpine
    container_name: cogarden-db-taches
    environment:
      POSTGRES_DB: taches_db
      POSTGRES_USER: cogarden_user
      POSTGRES_PASSWORD: cogarden_pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata-taches:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogarden_user -d taches_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogarden-network

  # Base de données pour le service Catalogue
  db-catalogue:
    image: postgres:15-alpine
    container_name: cogarden-db-catalogue
    environment:
      POSTGRES_DB: catalogue_db
      POSTGRES_USER: cogarden_user
      POSTGRES_PASSWORD: cogarden_pass
    ports:
      - "5435:5432"
    volumes:
      - pgdata-catalogue:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogarden_user -d catalogue_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogarden-network

  # Service Membres
  service-membres:
    build:
      context: ./services/membres
      dockerfile: Dockerfile
    container_name: cogarden-service-membres
    environment:
      PORT: 8001
      DB_HOST: cogarden-db-membres
      DB_PORT: 5432
      DB_NAME: membres_db
      DB_USER: cogarden_user
      DB_PASSWORD: cogarden_pass
    ports:
      - "8001:8001"
    depends_on:
      db-membres:
        condition: service_healthy
    networks:
      - cogarden-network

  # Service Parcelles
  service-parcelles:
    build:
      context: ./services/parcelles
      dockerfile: Dockerfile
    container_name: cogarden-service-parcelles
    environment:
      PORT: 8002
      DB_HOST: cogarden-db-parcelles
      DB_PORT: 5432
      DB_NAME: parcelles_db
      DB_USER: cogarden_user
      DB_PASSWORD: cogarden_pass
    ports:
      - "8002:8002"
    depends_on:
      db-parcelles:
        condition: service_healthy
    networks:
      - cogarden-network

  # Service Tâches
  service-taches:
    build:
      context: ./services/taches
      dockerfile: Dockerfile
    container_name: cogarden-service-taches
    environment:
      PORT: 8003
      DB_HOST: cogarden-db-taches
      DB_PORT: 5432
      DB_NAME: taches_db
      DB_USER: cogarden_user
      DB_PASSWORD: cogarden_pass
    ports:
      - "8003:8003"
    depends_on:
      db-taches:
        condition: service_healthy
    networks:
      - cogarden-network

  # Service Catalogue
  service-catalogue:
    build:
      context: ./services/catalogue
      dockerfile: Dockerfile
    container_name: cogarden-service-catalogue
    environment:
      PORT: 8004
      DB_HOST: cogarden-db-catalogue
      DB_PORT: 5432
      DB_NAME: catalogue_db
      DB_USER: cogarden_user
      DB_PASSWORD: cogarden_pass
    ports:
      - "8004:8004"
    depends_on:
      db-catalogue:
        condition: service_healthy
    networks:
      - cogarden-network

  # Frontend Admin
  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: cogarden-frontend-admin
    ports:
      - "3000:3000"
    depends_on:
      - service-membres
      - service-parcelles
      - service-taches
      - service-catalogue
    networks:
      - cogarden-network

  # Frontend Member
  frontend-member:
    build:
      context: ./frontend/member
      dockerfile: Dockerfile
    container_name: cogarden-frontend-member
    ports:
      - "3001:3001"
    depends_on:
      - service-membres
      - service-parcelles
      - service-taches
      - service-catalogue
    networks:
      - cogarden-network

volumes:
  pgdata-membres:
  pgdata-parcelles:
  pgdata-taches:
  pgdata-catalogue:

networks:
  cogarden-network:
    driver: bridge
